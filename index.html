  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.1) 0%,
      rgba(0,0,0,0.05) 40%,
      rgba(0,0,0,0.55) 70%,
      rgba(0,0,0,0.85) 100%
    );
  }

  /* scanlines */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.07) 2px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    width: 100%;
    padding: 0 2rem;
  }

  .tagline {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(0.6rem, 1.5vw, 0.8rem);
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    margin-bottom: 1rem;
    animation: fadeUp 0.8s 0.2s both;
  }

  .choose {
    font-size: clamp(0.75rem, 2vw, 1rem);
    font-weight: 700;
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    margin-bottom: 2rem;
    animation: fadeUp 0.8s 0.4s both;
  }

  .buttons {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
