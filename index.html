<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOCTURNIA | Choose Your Server</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Orbitron', sans-serif;
  }

  .splash {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 6vh;
  }

  .bg {
    position: absolute;
    inset: 0;
    background-image: url('server_extras/dayz-images/Screenshot_2026-05-22_230336.png');
    background-size: contain;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 0;
  }

  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.1) 0%,
      rgba(0,0,0,0.05) 40%,
      rgba(0,0,0,0.55) 70%,
      rgba(0,0,0,0.85) 100%
    );
  }

  /* scanlines */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.07) 2px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    width: 100%;
    padding: 0 2rem;
  }

  .tagline {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(0.6rem, 1.5vw, 0.8rem);
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    margin-bottom: 1rem;
    animation: fadeUp 0.8s 0.2s both;
  }

  .choose {
    font-size: clamp(0.75rem, 2vw, 1rem);
    font-weight: 700;
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    margin-bottom: 2rem;
    animation: fadeUp 0.8s 0.4s both;
  }

  .buttons {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeUp 0.8s 0.6s both;
  }

  .server-btn {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: clamp(160px, 22vw, 240px);
    height: clamp(70px, 10vw, 90px);
    text-decoration: none;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .server-btn:hover {
    transform: translateY(-3px);
  }

  .server-btn .btn-bg {
    position: absolute;
    inset: 0;
    transition: opacity 0.2s;
  }

  .server-btn .btn-label {
    position: relative;
    z-index: 1;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .server-btn .btn-sub {
    position: relative;
    z-index: 1;
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(0.55rem, 1vw, 0.65rem);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 0.2rem;
    opacity: 0.7;
  }

  /* DayZ button — cold cyan */
  .btn-dayz .btn-bg {
    background: rgba(0, 180, 220, 0.12);
    border: 1px solid rgba(0, 200, 255, 0.5);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .btn-dayz .btn-label { color: #00c8ff; text-shadow: 0 0 20px rgba(0,200,255,0.7); }
  .btn-dayz .btn-sub { color: #00c8ff; }
  .btn-dayz:hover .btn-bg { background: rgba(0, 180, 220, 0.25); box-shadow: 0 0 40px rgba(0,200,255,0.3) inset; }
  .btn-dayz:hover { box-shadow: 0 0 30px rgba(0,200,255,0.4); }

  /* HumanitZ button — blood red */
  .btn-humanitz .btn-bg {
    background: rgba(200, 30, 30, 0.12);
    border: 1px solid rgba(220, 50, 50, 0.5);
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  }
  .btn-humanitz .btn-label { color: #ff4444; text-shadow: 0 0 20px rgba(255,50,50,0.7); }
  .btn-humanitz .btn-sub { color: #ff4444; }
  .btn-humanitz:hover .btn-bg { background: rgba(200, 30, 30, 0.25); box-shadow: 0 0 40px rgba(220,50,50,0.3) inset; }
  .btn-humanitz:hover { box-shadow: 0 0 30px rgba(220,50,50,0.4); }

  /* Deer Isle button — toxic bioluminescent green */
  .btn-deerisle .btn-bg {
    background: rgba(20, 100, 45, 0.12);
    border: 1px solid rgba(45, 255, 126, 0.5);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .btn-deerisle .btn-label { color: #2dff7e; text-shadow: 0 0 20px rgba(45,255,126,0.7); }
  .btn-deerisle .btn-sub { color: #2dff7e; }
  .btn-deerisle:hover .btn-bg { background: rgba(20, 100, 45, 0.25); box-shadow: 0 0 40px rgba(45,255,126,0.3) inset; }
  .btn-deerisle:hover { box-shadow: 0 0 30px rgba(45,255,126,0.4); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="splash">
  <div class="bg"></div>
  <div class="content">
    <p class="tagline">Nocturnia Hardcore Gaming</p>
    <p class="choose">Choose Your Server</p>
    <div class="buttons">
      <a href="dayz.html" class="server-btn btn-dayz">
        <div class="btn-bg"></div>
        <span class="btn-label">DayZ</span>
        <span class="btn-sub">Namalsk · Hardcore PvE</span>
      </a>
      <a href="deerisle.html" class="server-btn btn-deerisle">
        <div class="btn-bg"></div>
        <span class="btn-label">Deer Isle</span>
        <span class="btn-sub">Deer Isle · Hardcore PvE</span>
      </a>
      <a href="humanitz.html" class="server-btn btn-humanitz">
        <div class="btn-bg"></div>
        <span class="btn-label">HumanitZ</span>
        <span class="btn-sub">PvE · Zombie Survival</span>
      </a>
    </div>
  </div>
</div>

</body>
</html>
