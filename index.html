<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOCTURNIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Orbitron', sans-serif;
  }

  .splash {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 6vh;
  }

  .bg {
    position: absolute;
    inset: 0;
    background-image: url('server_extras/dayz-images/Screenshot_2026-05-22_230336.png');
    background-size: contain;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 0;
  }

  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.1) 0%,
      rgba(0,0,0,0.05) 40%,
      rgba(0,0,0,0.55) 70%,
      rgba(0,0,0,0.85) 100%
    );
  }

  /* scanlines */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.07) 2px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    width: 100%;
    padding: 0 2rem;
  }

  .buttons {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeUp 0.8s 0.6s both;
  }

  .server-btn {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: clamp(160px, 22vw, 240px);
    height: clamp(70px, 10vw, 90px);
    text-decoration: none;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .server-btn:hover {
    transform: translateY(-3px);
  }

  .server-btn .btn-bg {
    position: absolute;
    inset: 0;
    transition: opacity 0.2s;
  }

  .server-btn .btn-label {
    position: relative;
    z-index: 1;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .server-btn .btn-sub {
    position: relative;
    z-index: 1;
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(0.55rem, 1vw, 0.65rem);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 0.2rem;
    opacity: 0.7;
  }

  /* DayZ button — cold cyan */
  .btn-dayz .btn-bg {
    background: rgba(0, 180, 220, 0.12);
    border: 1px solid rgba(0, 200, 255, 0.5);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .btn-dayz .btn-label { color: #00c8ff; text-shadow: 0 0 20px rgba(0,200,255,0.7); }
  .btn-dayz .btn-sub { color: #00c8ff; }
  .btn-dayz:hover .btn-bg { background: rgba(0, 180, 220, 0.25); box-shadow: 0 0 40px rgba(0,200,255,0.3) inset; }
  .btn-dayz:hover { box-shadow: 0 0 30px rgba(0,200,255,0.4); }

  /* HumanitZ button — blood red */
  .btn-humanitz .btn-bg {
    background: rgba(200, 30, 30, 0.12);
    border: 1px solid rgba(220, 50, 50, 0.5);
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  }
  .btn-humanitz .btn-label { color: #ff4444; text-shadow: 0 0 20px rgba(255,50,50,0.7); }
  .btn-humanitz .btn-sub { color: #ff4444; }
  .btn-humanitz:hover .btn-bg { background: rgba(200, 30, 30, 0.25); box-shadow: 0 0 40px rgba(220,50,50,0.3) inset; }
  .btn-humanitz:hover { box-shadow: 0 0 30px rgba(220,50,50,0.4); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="splash">
  <div class="bg"></div>
  <div class="content">
    <div class="buttons">
      <a href="dayz.html" class="server-btn btn-dayz">
        <div class="btn-bg"></div>
        <span class="btn-label">DayZ</span>
      </a>
      <a href="other-games.html" class="server-btn btn-humanitz">
        <div class="btn-bg"></div>
        <span class="btn-label">Other Games</span>
      </a>
    </div>
  </div>
</div>

<!-- SURVIVOR PROTOCOL BADGE -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
.dayz-badge-container {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 14px;
  background: rgba(10, 11, 12, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-top: 2px solid #ff2a2a;
  box-shadow: 
    0 6px 18px rgba(0, 0, 0, 0.85),
    inset 0 0 10px rgba(0, 0, 0, 0.6);
  font-family: 'Share Tech Mono', monospace;
  overflow: hidden;
  width: 150px;
  margin: 24px auto;
  border-radius: 4px;
}
.hud-scanlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    rgba(18, 16, 16, 0) 50%, 
    rgba(0, 0, 0, 0.25) 50%
  ), linear-gradient(
    90deg, 
    rgba(255, 0, 0, 0.03), 
    rgba(0, 255, 0, 0.01), 
    rgba(0, 0, 255, 0.03)
  );
  background-size: 100% 4px, 6px 100%;
  z-index: 1;
}
.tactical-visor {
  position: relative;
  width: 70px;
  height: 3px;
  background: rgba(0, 0, 0, 0.8);
  border-radius: 1px;
  margin-bottom: 6px;
  overflow: hidden;
  z-index: 2;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.laser-scanner {
  position: absolute;
  top: 0;
  width: 18px;
  height: 100%;
  background: linear-gradient(to right, transparent, #ff0000, transparent);
  box-shadow: 
    0 0 6px #ff0000,
    0 0 12px rgba(255, 0, 0, 0.7);
  animation: cylon-scan 0.9s infinite ease-in-out alternate;
}
.badge-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}
.hud-label {
  font-size: 6px;
  color: #ff2a2a;
  letter-spacing: 0.12em;
  opacity: 0.85;
}
.designed-by {
  font-size: 6.5px;
  color: #a0a5ad;
  letter-spacing: 0.1em;
}
.creator-name {
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.12em;
  color: #ffffff;
  text-shadow: 
    0 0 8px rgba(255, 255, 255, 0.1),
    1.5px 1.5px 0px rgba(0, 0, 0, 0.9);
}
@keyframes cylon-scan {
  0% { left: -25%; }
  100% { left: 100%; }
}
</style>
<div class="dayz-badge-container">
  <div class="hud-scanlines"></div>
  <div class="tactical-visor">
    <div class="laser-scanner"></div>
  </div>
  <div class="badge-content">
    <span class="hud-label">SURVIVOR PROTOCOL /</span>
    <span class="designed-by">DESIGNED & BUILT BY</span>
    <span class="creator-name">TJOKERK</span>
  </div>
</div>

</body>
</html>
