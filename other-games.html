<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOCTURNIA | Other Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Orbitron', sans-serif;
  }

  .splash {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .bg {
    position: absolute;
    inset: 0;
    background-image: url('server_extras/dayz-images/Screenshot_2026-05-22_230336.png');
    background-size: contain;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 0;
  }

  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.35) 0%,
      rgba(0,0,0,0.3) 40%,
      rgba(0,0,0,0.6) 70%,
      rgba(0,0,0,0.9) 100%
    );
  }

  /* scanlines */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.07) 2px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    width: 100%;
    padding: 0 2rem;
  }

  .back-link {
    position: fixed;
    top: 2rem;
    left: 2rem;
    z-index: 3;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.25);
    padding: 0.5rem 1rem;
    transition: color 0.2s, border-color 0.2s;
  }
  .back-link:hover { color: #fff; border-color: rgba(255,255,255,0.6); }

  .buttons {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeUp 0.8s 0.2s both;
  }

  .server-btn {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: clamp(160px, 22vw, 240px);
    height: clamp(70px, 10vw, 90px);
    text-decoration: none;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .server-btn:hover {
    transform: translateY(-3px);
  }

  .server-btn .btn-bg {
    position: absolute;
    inset: 0;
    transition: opacity 0.2s;
  }

  .server-btn .btn-label {
    position: relative;
    z-index: 1;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .server-btn .btn-sub {
    position: relative;
    z-index: 1;
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(0.55rem, 1vw, 0.65rem);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 0.2rem;
    opacity: 0.7;
  }

  /* HumanitZ button — blood red */
  .btn-humanitz .btn-bg {
    background: rgba(200, 30, 30, 0.12);
    border: 1px solid rgba(220, 50, 50, 0.5);
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  }
  .btn-humanitz .btn-label { color: #ff4444; text-shadow: 0 0 20px rgba(255,50,50,0.7); }
  .btn-humanitz .btn-sub { color: #ff4444; }
  .btn-humanitz:hover .btn-bg { background: rgba(200, 30, 30, 0.25); box-shadow: 0 0 40px rgba(220,50,50,0.3) inset; }
  .btn-humanitz:hover { box-shadow: 0 0 30px rgba(220,50,50,0.4); }

  /* Coming Soon button — inert / disabled */
  .btn-soon {
    cursor: not-allowed;
  }
  .btn-soon .btn-bg {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.2);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .btn-soon .btn-label { color: rgba(255,255,255,0.35); }
  .btn-soon .btn-sub { color: rgba(255,255,255,0.25); }
  .btn-soon:hover { transform: none; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">&larr; Back</a>

<div class="splash">
  <div class="bg"></div>
  <div class="content">
    <div class="buttons">
      <a href="humanitz.html" class="server-btn btn-humanitz">
        <div class="btn-bg"></div>
        <span class="btn-label">HumanitZ</span>
        <span class="btn-sub">PvE &middot; Zombie Survival</span>
      </a>
      <span class="server-btn btn-soon" aria-disabled="true">
        <div class="btn-bg"></div>
        <span class="btn-label">Coming Soon</span>
      </span>
    </div>
  </div>
</div>

</body>
</html>
