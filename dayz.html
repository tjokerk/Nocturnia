<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOCTURNIA | DayZ Servers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Orbitron', sans-serif;
  }

  .splash {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4vh 0;
  }

  .bg {
    position: absolute;
    inset: 0;
    background-image: url('server_extras/dayz-images/Screenshot_2026-05-22_230336.png');
    background-size: contain;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 0;
  }

  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.35) 0%,
      rgba(0,0,0,0.3) 40%,
      rgba(0,0,0,0.6) 70%,
      rgba(0,0,0,0.9) 100%
    );
  }

  /* scanlines */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.07) 2px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    width: 100%;
    padding: 0 2rem;
  }

  .back-link {
    position: fixed;
    top: 2rem;
    left: 2rem;
    z-index: 3;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.25);
    padding: 0.5rem 1rem;
    transition: color 0.2s, border-color 0.2s;
  }
  .back-link:hover { color: #fff; border-color: rgba(255,255,255,0.6); }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    align-items: center;
    animation: fadeUp 0.8s 0.2s both;
  }

  .server-btn {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: clamp(220px, 30vw, 340px);
    height: clamp(70px, 10vw, 90px);
    text-decoration: none;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .server-btn:hover {
    transform: translateY(-3px);
  }

  .server-btn .btn-bg {
    position: absolute;
    inset: 0;
    transition: opacity 0.2s;
  }

  .server-btn .btn-label {
    position: relative;
    z-index: 1;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .server-btn .btn-sub {
    position: relative;
    z-index: 1;
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(0.55rem, 1vw, 0.65rem);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 0.2rem;
    opacity: 0.7;
  }

  /* Banov button — gunmetal black / diamond-plate red, ref: Banov_Gun.png */
  .btn-banov .btn-bg {
    background:
      repeating-linear-gradient(135deg, transparent 0 10px, rgba(220,30,30,0.22) 10px 11px, transparent 11px 22px),
      repeating-linear-gradient(45deg, transparent 0 10px, rgba(220,30,30,0.22) 10px 11px, transparent 11px 22px),
      linear-gradient(160deg, rgba(35,35,35,0.7) 0%, rgba(10,10,10,0.75) 100%);
    border: 1px solid rgba(220, 40, 40, 0.65);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .btn-banov .btn-label { color: #ff2b2b; text-shadow: 0 0 20px rgba(255,40,40,0.8), 0 0 2px rgba(255,255,255,0.4); }
  .btn-banov .btn-sub { color: #d8d8d8; }
  .btn-banov:hover .btn-bg { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 0 40px rgba(220,35,35,0.35) inset; }
  .btn-banov:hover { box-shadow: 0 0 30px rgba(220,35,35,0.45); }

  /* Deer Isle button — toxic bioluminescent green */
  .btn-deerisle .btn-bg {
    background: rgba(20, 100, 45, 0.12);
    border: 1px solid rgba(45, 255, 126, 0.5);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .btn-deerisle .btn-label { color: #2dff7e; text-shadow: 0 0 20px rgba(45,255,126,0.7); }
  .btn-deerisle .btn-sub { color: #2dff7e; }
  .btn-deerisle:hover .btn-bg { background: rgba(20, 100, 45, 0.25); box-shadow: 0 0 40px rgba(45,255,126,0.3) inset; }
  .btn-deerisle:hover { box-shadow: 0 0 30px rgba(45,255,126,0.4); }

  /* Namalsk button — cold cyan */
  .btn-namalsk .btn-bg {
    background: rgba(0, 180, 220, 0.12);
    border: 1px solid rgba(0, 200, 255, 0.5);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .btn-namalsk .btn-label { color: #00c8ff; text-shadow: 0 0 20px rgba(0,200,255,0.7); }
  .btn-namalsk .btn-sub { color: #00c8ff; }
  .btn-namalsk:hover .btn-bg { background: rgba(0, 180, 220, 0.25); box-shadow: 0 0 40px rgba(0,200,255,0.3) inset; }
  .btn-namalsk:hover { box-shadow: 0 0 30px rgba(0,200,255,0.4); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">&larr; Back</a>

<div class="splash">
  <div class="bg"></div>
  <div class="content">
    <div class="buttons">
      <a href="banov.html" class="server-btn btn-banov">
        <div class="btn-bg"></div>
        <span class="btn-label">Banov</span>
        <span class="btn-sub">Sci-Fi PvE &middot; Progression</span>
      </a>
      <a href="deerisle-construction.html" class="server-btn btn-deerisle">
        <div class="btn-bg"></div>
        <span class="btn-label">Deer Isle</span>
        <span class="btn-sub">Deer Isle &middot; Hardcore PvE</span>
      </a>
      <a href="namalsk-construction.html" class="server-btn btn-namalsk">
        <div class="btn-bg"></div>
        <span class="btn-label">Namalsk</span>
        <span class="btn-sub">Namalsk &middot; Hardcore PvE</span>
      </a>
    </div>
  </div>
</div>

</body>
</html>
